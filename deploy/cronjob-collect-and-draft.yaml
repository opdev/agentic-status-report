apiVersion: batch/v1
kind: CronJob
metadata:
  name: weekly-status-collect-and-draft
  labels:
    app.kubernetes.io/name: weekly-status
    app.kubernetes.io/component: automation
spec:
  schedule: "30 8 * * 5"  # Friday 08:30 ET
  timeZone: "America/New_York"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: weekly-status
            app.kubernetes.io/component: automation
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: collect-and-draft
              image: quay.io/opdev/weekly-status:latest
              imagePullPolicy: Always
              command: ["status", "run-week", "collect-and-draft", "--week", "auto"]
              envFrom:
                - secretRef:
                    name: weekly-status-secrets
              resources:
                requests:
                  memory: 512Mi
                  cpu: 200m
                limits:
                  memory: 1Gi
                  cpu: "1"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
