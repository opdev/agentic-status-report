apiVersion: batch/v1
kind: CronJob
metadata:
  name: weekly-status-send-drafts
  labels:
    app.kubernetes.io/name: weekly-status
    app.kubernetes.io/component: automation
spec:
  schedule: "0 14 * * 5"  # Friday 09:00 ET
  timeZone: "America/New_York"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: weekly-status
            app.kubernetes.io/component: automation
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: send-drafts
              image: quay.io/opdev/weekly-status:latest
              imagePullPolicy: Always
              command: ["sh", "-c", "set -eu && status run-week send-drafts --week auto"]
              envFrom:
                - secretRef:
                    name: weekly-status-secrets
              resources:
                requests:
                  memory: 256Mi
                  cpu: 100m
                limits:
                  memory: 512Mi
                  cpu: 500m
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
